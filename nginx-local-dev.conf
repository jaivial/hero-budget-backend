# =============================================================================
# NGINX Configuration for Local Development
# =============================================================================
# Purpose: Reverse proxy for local backend microservices
# Listens on: http://localhost:8080
# React Native dev server: http://localhost:8200 (Metro bundler)
#
# Usage:
# 1. Start all backend services: ./restart_local_services.sh
# 2. Start NGINX with this config: nginx -c $(pwd)/backend/nginx-local-dev.conf
# 3. Start React Native: cd HerobudgetReact && npx react-native start --port=8200
# 4. App will make API calls to localhost:8080, which routes to backend services
# =============================================================================

# Required events block for NGINX
events {
    worker_connections 1024;
}

# HTTP block contains all upstream and server configurations
http {
    # Upstream definitions for each backend service
    upstream backend_google_auth {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream backend_apple_auth {
    server 127.0.0.1:8100;
    keepalive 16;
}

upstream backend_signup {
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream backend_signin {
    server 127.0.0.1:8084;
    keepalive 16;
}

upstream backend_reset_password {
    server 127.0.0.1:8086;
    keepalive 16;
}

upstream backend_savings {
    server 127.0.0.1:8089;
    keepalive 16;
}

upstream backend_cash_bank {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream backend_bills {
    server 127.0.0.1:8091;
    keepalive 16;
}

upstream backend_profile {
    server 127.0.0.1:8092;
    keepalive 16;
}

upstream backend_income {
    server 127.0.0.1:8093;
    keepalive 16;
}

upstream backend_expense {
    server 127.0.0.1:8094;
    keepalive 16;
}

upstream backend_transaction_delete {
    server 127.0.0.1:8095;
    keepalive 16;
}

upstream backend_categories {
    server 127.0.0.1:8096;
    keepalive 16;
}

upstream backend_delta_sync {
    server 127.0.0.1:8097;
    keepalive 16;
}

upstream backend_user_locale {
    server 127.0.0.1:8099;
    keepalive 16;
}

# Main server block
server {
    listen 8080;
    server_name localhost;

    # Optimized timeout configuration for local development
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    proxy_buffering             on;
    proxy_buffer_size           8k;
    proxy_buffers               16 8k;
    proxy_busy_buffers_size     16k;

    # Common headers for all proxied requests
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # =============================================================================
    # AUTHENTICATION ROUTES
    # =============================================================================

    # Google Authentication (port 8081)
    location /auth/google {
        proxy_pass http://backend_google_auth;
    }

    # Apple Authentication (port 8100)
    location /auth/apple {
        proxy_pass http://backend_apple_auth;
    }

    # Signin (port 8084)
    location /signin {
        proxy_pass http://backend_signin;
    }

    location /signin/ {
        proxy_pass http://backend_signin/;
    }

    # Signup (port 8082)
    location /signup {
        proxy_pass http://backend_signup;
    }

    location /signup/ {
        proxy_pass http://backend_signup/;
    }

    # Reset Password (port 8086)
    location /reset-password {
        proxy_pass http://backend_reset_password;
    }

    location /reset-password/ {
        proxy_pass http://backend_reset_password/;
    }

    # =============================================================================
    # DATA MANAGEMENT ROUTES
    # =============================================================================

    # Categories (port 8096)
    location /categories {
        proxy_pass http://backend_categories;
    }

    location /categories/ {
        proxy_pass http://backend_categories/;
    }

    # Incomes (port 8093)
    location /incomes {
        proxy_pass http://backend_income;
    }

    location /incomes/ {
        proxy_pass http://backend_income/;
    }

    # Expenses (port 8094)
    location /expenses {
        proxy_pass http://backend_expense;
    }

    location /expenses/ {
        proxy_pass http://backend_expense/;
    }

    # Bills (port 8091)
    location /bills {
        proxy_pass http://backend_bills;
    }

    location /bills/ {
        proxy_pass http://backend_bills/;
    }

    # Savings (port 8089)
    location /savings {
        proxy_pass http://backend_savings;
    }

    location /savings/ {
        proxy_pass http://backend_savings/;
    }

    # Cash & Bank Management (port 8090)
    location /cash-bank {
        proxy_pass http://backend_cash_bank;
    }

    location /cash-bank/ {
        proxy_pass http://backend_cash_bank/;
    }

    # Transfers (routed to cash_bank service)
    location /transfer {
        proxy_pass http://backend_cash_bank;
    }

    location /transfer/ {
        proxy_pass http://backend_cash_bank/;
    }

    # =============================================================================
    # TRANSACTION & SYNC ROUTES
    # =============================================================================

    # Transaction Delete Service (port 8095)
    location /transactions {
        proxy_pass http://backend_transaction_delete;
    }

    location /transactions/ {
        proxy_pass http://backend_transaction_delete/;
    }

    # Delta Sync Service (port 8097)
    location /sync {
        proxy_pass http://backend_delta_sync;
    }

    location /sync/ {
        proxy_pass http://backend_delta_sync/;
    }

    # =============================================================================
    # USER & PROFILE ROUTES
    # =============================================================================

    # Profile Management (port 8092)
    location /profile {
        proxy_pass http://backend_profile;
    }

    location /profile/ {
        proxy_pass http://backend_profile/;
    }

    location /user {
        proxy_pass http://backend_profile;
    }

    location /user/ {
        proxy_pass http://backend_profile/;
    }

    # User Locale (port 8099)
    location /user_locale {
        proxy_pass http://backend_user_locale;
    }

    location /user_locale/ {
        proxy_pass http://backend_user_locale/;
    }

    # Locale update (legacy, routed to google_auth)
    location /update/locale {
        proxy_pass http://backend_google_auth;
    }

    # =============================================================================
    # HEALTH CHECK ROUTES
    # =============================================================================

    location /health {
        proxy_pass http://backend_savings/health;
    }

    location /savings/health {
        proxy_pass http://backend_savings/health;
    }

    # =============================================================================
    # DEFAULT ROUTE
    # =============================================================================

    location / {
        return 404 '{"error": "Endpoint not found. Check NGINX routing configuration."}';
        add_header Content-Type application/json;
    }

    # Logs for debugging
    access_log /tmp/nginx_herobudget_local_access.log;
    error_log /tmp/nginx_herobudget_local_error.log warn;
    }
}
